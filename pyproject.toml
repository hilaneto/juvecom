[project]
name = "juvecom"
version = "0.1.0"
description = "Sistema web para gestão de lojas Shopee, planos, contatos, contratos e cobranças."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "load-dotenv>=0.1.0",
    "num2words>=0.5.14",
    "peewee>=4.5.1",
    "psycopg2>=2.9.13",
    "pymupdf>=1.28.2",
]

[dependency-groups]
dev = []
