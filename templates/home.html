<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juvaecom | Gestão de lojas Shopee</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/juvaecom.css') }}">
</head>
<body>
    <nav class="menu-principal" aria-label="Menu principal">
        <a class="menu-principal__marca" href="{{ url_for('home') }}">
            Juva<span>ecom</span>
        </a>

        <div class="menu-principal__links">
            <a href="{{ url_for('plano') }}">Planos</a>
            <a href="{{ url_for('contato') }}">Contato</a>
            <a href="{{ url_for('adm') }}">Área administrativa</a>
        </div>
    </nav>

    <main class="home">
        <div class="home__imagem" aria-hidden="true">
            <img src="{{ url_for('static', filename='img/juvaecom.jpg') }}" alt="">
        </div>

        <div class="home__conteudo">
            <div class="home__categoria">Gestão de lojas Shopee</div>

            <h1>O próximo nível da sua loja <span>começa agora.</span></h1>

            <p class="home__descricao">
                Anúncios bem apresentados, campanhas acompanhadas de perto
                e decisões guiadas pelos resultados. Uma gestão dedicada
                para sua loja evoluir.
            </p>

            <a class="home__botao" href="{{ url_for('plano') }}">
                Conheça nossos planos
            </a>

            <a class="home__botao home__botao--instagram"
            href="https://www.instagram.com/juvaecom/"
            target="_blank" rel="noopener noreferrer">
                <svg width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="5"/>
                    <circle cx="12" cy="12" r="4"/>
                    <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
                </svg>
                Instagram · @juvaecom
            </a>

        </div>
    </main>

</body>
</html>
