
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Cadastro Recebido | Juvaecom</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .mensagem {
            max-width: 600px;
            margin: 100px auto;
            padding: 40px 25px;
            background: #fff;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        h1 {
            color: #24834b;
        }

        p {
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <main class="mensagem">

        <h1>Cadastro recebido com sucesso!</h1>

        <p>
            Seus dados cadastrais foram recebidos
            pela Juvaecom.
        </p>

        <p>
            Nossa equipe realizará a conferência
            das informações e entrará em contato
            caso seja necessário.
        </p>

        <p>
            Obrigado!
        </p>

    </main>

</body>
</html>
