
{% set endereco = dados.get('dados') or {} %}

<h2 class="pessoa-form__titulo">Dados da Pessoa</h2>

<div class="pessoa-campo--tipo">
    <label for="tp_pessoa">Tipo *</label>
    <select id="tp_pessoa" name="tp_pessoa" required>
        <option value="">Selecione</option>
        <option value="F" {% if dados.get('tp_pessoa') == 'F' %}selected{% endif %}>Física</option>
        <option value="J" {% if dados.get('tp_pessoa') == 'J' %}selected{% endif %}>Jurídica</option>
    </select>
</div>

<div class="pessoa-campo--nome">
    <label for="nm_pessoa">Nome / Razão social *</label>
    <input id="nm_pessoa" name="nm_pessoa" type="text" maxlength="150" required
           value="{{ dados.get('nm_pessoa') or '' }}">
</div>

<div class="pessoa-campo--documento">
    <label for="cpf_cnpj">CPF/CNPJ *</label>
    <input id="cpf_cnpj" name="cpf_cnpj" type="text" maxlength="18" required
           value="{{ dados.get('cpf_cnpj') or '' }}">
</div>

<div class="pessoa-campo--telefone">
    <label for="telefone">Telefone</label>
    <input id="telefone" name="telefone" type="tel" maxlength="20"
           value="{{ dados.get('telefone') or '' }}">
</div>

<div class="pessoa-campo--email">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" maxlength="150"
           value="{{ dados.get('email') or '' }}">
</div>

<hr class="pessoa-form__divisor">

<h2 class="pessoa-form__titulo">Endereço</h2>

<div class="pessoa-campo--endereco">
    <label for="endereco">Endereço</label>
    <input id="endereco" name="endereco" type="text" maxlength="60"
           value="{{ endereco.get('endereco') or '' }}">
</div>

<div class="pessoa-campo--numero">
    <label for="numero">Número</label>
    <input id="numero" name="numero" type="text" maxlength="10"
           value="{{ endereco.get('numero') or '' }}">
</div>

<div class="pessoa-campo--complemento">
    <label for="complemento">Complemento</label>
    <input id="complemento" name="complemento" type="text" maxlength="20"
           value="{{ endereco.get('complemento') or '' }}">
</div>

<div class="pessoa-campo--bairro">
    <label for="bairro">Bairro</label>
    <input id="bairro" name="bairro" type="text" maxlength="50"
           value="{{ endereco.get('bairro') or '' }}">
</div>

<div class="pessoa-campo--cidade">
    <label for="cidade">Cidade</label>
    <input id="cidade" name="cidade" type="text" maxlength="50"
           value="{{ endereco.get('cidade') or '' }}">
</div>

<div class="pessoa-campo--uf">
    <label for="uf">UF</label>
    <input id="uf" name="uf" type="text" maxlength="2" pattern="[A-Za-z]{2}"
           value="{{ endereco.get('uf') or '' }}">
</div>

<div class="pessoa-campo--cep">
    <label for="cep">CEP</label>
    <input id="cep" name="cep" type="text" maxlength="9" inputmode="numeric"
           value="{{ endereco.get('cep') or '' }}">
</div>
