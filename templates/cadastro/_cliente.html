
<div class="cliente-form__grid">

    <hr class="pessoa-form__divisor">
    <h2 class="pessoa-form__titulo">Dados do Cliente</h2>

    <div class="cliente-campo--responsavel">
        <label for="nm_responsavel">Responsável</label>
        <input id="nm_responsavel" name="nm_responsavel"
               type="text" maxlength="150"
               value="{{ cliente.get('nm_responsavel') or '' }}">
    </div>

    <div class="cliente-campo--contato">
        <label for="cd_contato">Código do contato</label>
        <input id="cd_contato" name="cd_contato"
               type="number" min="1"
               value="{{ cliente.get('cd_contato') or '' }}">
    </div>

    <div class="cliente-campo--ativo">
        <label for="status_cliente">Status do cliente</label>
        <input id="status_cliente" type="text"
               value="{{ dict(filtros_status).get(cliente.get('cd_status', 1), '') }}" readonly>
    </div>

    <div class="cliente-campo--cadastro">
        <label for="dt_cadastro">Data de cadastro</label>
        <input id="dt_cadastro" name="dt_cadastro"
               type="date"
               value="{{ cliente.get('dt_cadastro') or hoje }}"
               required>
    </div>

</div>
